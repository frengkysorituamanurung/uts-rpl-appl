server:
  port: 8083

spring:
  application:
    name: ehr-service
  datasource:
    url: jdbc:postgresql://localhost:5434/ehr_db
    username: meditrack
    password: meditrack123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
